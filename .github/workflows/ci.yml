name: CI

# Actions are pinned by commit SHA (the version is the comment); Dependabot bumps both.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Python the tests run on. The docker job checks the image's base Python against it, so a
  # Dependabot python:3.x-slim bump fails until this is bumped too.
  PYTHON_VERSION: "3.14"
  # The oldest Python the package supports (requires-python in pyproject.toml, which the
  # test-min-python job checks): the tests also run on it.
  MIN_PYTHON_VERSION: "3.11"
  # uv for every job; bump together with the ghcr.io/astral-sh/uv tag in the Dockerfile (the test
  # job checks they match) and UV_VERSION in release.yml (tests/test_workflows.py checks it).
  UV_VERSION: "0.13.5"

concurrency:
  # A newer push to a PR supersedes its run. Each push to main gets its own group, so main runs
  # never queue against (and cancel) each other: every main commit gets its image. Two
  # overlapping main runs may push :latest out of order; deploys pin sha-<short>, so it doesn't
  # matter.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Dockerfile uv stage matches CI uv
        run: |
          docker_uv=$(sed -n 's#^FROM ghcr.io/astral-sh/uv:\([^ @]*\).* AS uv$#\1#p' Dockerfile)
          ci_uv=$(uv --version | cut -d' ' -f2)
          if [ -z "$docker_uv" ] || [ "$docker_uv" != "$ci_uv" ]; then
            echo "::error file=Dockerfile::Dockerfile uv stage is '${docker_uv:-<not found>}' but CI uses uv $ci_uv. Bump UV_VERSION in .github/workflows/ci.yml and the ghcr.io/astral-sh/uv tag in the Dockerfile together."
            exit 1
          fi
          echo "uv $ci_uv in both CI and Dockerfile"
      # The same checks a developer runs (scripts/check.sh): uv.lock matches pyproject.toml, ruff,
      # mdformat on every tracked .md, mypy, pytest with coverage (fails under
      # [tool.coverage.report] fail_under in pyproject.toml). The coverage report also goes to the
      # job summary, through PYTEST_ADDOPTS.
      - run: PYTEST_ADDOPTS="--cov-report=markdown-append:$GITHUB_STEP_SUMMARY" scripts/check.sh

  # The tests on the oldest supported Python, so code that needs a newer one (syntax, stdlib)
  # fails here rather than for someone installing on it. A required check, like `test`.
  test-min-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: MIN_PYTHON_VERSION matches requires-python
        run: |
          declared=$(sed -n 's/^requires-python = ">=\([0-9.]*\)"$/\1/p' pyproject.toml)
          if [ "$declared" != "$MIN_PYTHON_VERSION" ]; then
            echo "::error file=pyproject.toml::requires-python is '>=${declared:-<not found>}' but CI tests the minimum as $MIN_PYTHON_VERSION. Bump MIN_PYTHON_VERSION in .github/workflows/ci.yml with requires-python."
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.MIN_PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --extra dev --python "$MIN_PYTHON_VERSION"
      - run: uv run --frozen pytest -q

  # Builds the image once, smoke-tests it, and on main pushes that same image to GHCR as
  # ghcr.io/<repo>:sha-<short> and :latest. The deployment pulls it (scripts/deploy.sh), so
  # production runs the image CI tested, not a second build. Runs after the tests, so a commit
  # whose tests fail never gets an image (nor moves :latest).
  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: inbox-jev:ci
          load: true
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Run as an arbitrary non-root uid, like production (APP_UID in docker-compose.yml).
      - name: Smoke test (CLI)
        run: docker run --rm --user 10100:10100 inbox-jev:ci --help
      - name: Smoke test (package installed non-editable)
        run: >-
          docker run --rm --user 10100:10100 --entrypoint python inbox-jev:ci -c
          "import inbox_jev; assert 'site-packages' in inbox_jev.__file__, inbox_jev.__file__; print(inbox_jev.__file__)"
      # The vendored public suffix list is package data: a wheel without it fails here.
      - name: Smoke test (public suffix list ships in the image)
        run: >-
          docker run --rm --user 10100:10100 --entrypoint python inbox-jev:ci -c
          "from inbox_jev import psl; assert psl.is_public_suffix('co.uk'); print(len(psl.bundled().rules), 'rules')"
      - name: Image reports the commit it was built from
        run: |
          reported=$(docker run --rm --user 10100:10100 inbox-jev:ci --version)
          echo "$reported"
          case $reported in
            *"($GITHUB_SHA)"*) ;;
            *) echo "::error::'inbox-jev --version' doesn't report $GITHUB_SHA"; exit 1 ;;
          esac
      - name: Image Python matches CI Python
        run: |
          image_py=$(docker run --rm --user 10100:10100 --entrypoint python inbox-jev:ci -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          if [ "$image_py" != "$PYTHON_VERSION" ]; then
            echo "::error file=Dockerfile::The image runs Python $image_py but CI tests on $PYTHON_VERSION. Bump PYTHON_VERSION in .github/workflows/ci.yml in the same PR as the Dockerfile base image."
            exit 1
          fi
          echo "Python $image_py in both CI and the image"
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag inbox-jev:ci "$image:sha-${GITHUB_SHA::7}"
          docker tag inbox-jev:ci "$image:latest"
          docker push "$image:sha-${GITHUB_SHA::7}"
          docker push "$image:latest"

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks-action needs a paid license for org repos; the CLI image is free.
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact -v
