name: QA gate

# Turns the latest "## QA review" comment on a PR into the `qa-verdict` commit status of its head
# (scripts/qa_gate.py). The repo ruleset requires that status, so a PR merges only when QA
# approved the exact commit being merged. Re-evaluated on every push to the PR and on every
# comment. The comment-triggered run uses the workflow and script from `main`.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read        # commits, compare and fetch, for update-branch merges
  pull-requests: read   # the PR head and base
  issues: read          # the PR comments
  statuses: write       # the qa-verdict status

# One group per PR and trigger: a newer push supersedes the run for an older head, a newer comment
# an older comment's run. A comment never cancels a push's run: dev-fixer pushes and replies
# within seconds, and the cancelled run left a cancelled "QA gate" check on the new head (the PR
# showed UNSTABLE) even though it had already posted `qa-verdict` (pending). A comment's run is
# checked against `main`'s commit, not the PR head, so cancelling it marks nothing on the PR. Both
# kinds read the PR's current state and post on the head they read, so the latest run's status
# stands.
concurrency:
  group: qa-gate-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  gate:
    name: QA gate
    # Only the commit status is called `qa-verdict`: a job of that name would be a check run
    # with the same name, green whenever the script exits 0. The job passes whenever it posted a
    # status, `pending` and `failure` included (the verdict is the status, which the ruleset
    # requires, not this job); it fails only when the gate couldn't run (a `gh api` error).
    # Dependabot's pull_request runs get a read-only token and can't post statuses, so they are
    # skipped: its PRs get the status from the comment-triggered run, once the session posts its
    # review.
    if: >-
      (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]')
      || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history, no working tree beyond the script: to accept an update-branch merge the
      # script fetches the PR head and the base and checks with `git merge-tree` that the merge
      # adds nothing of its own, reading objects only (ADR 0055). Which run is trusted: an
      # `issue_comment` run checks out `main` and runs `main`'s workflow and script, so no PR code
      # runs there. A `pull_request` run checks out the PR's merge ref and runs the PR's own
      # workflow and `scripts/qa_gate.py` with `statuses: write` (a fork's PR gets a read-only
      # token and posts nothing), so a PR that edits the gate is judged by its own copy until the
      # next review comment re-runs `main`'s. Only the comment-triggered status is authoritative;
      # for a PR that touches the gate, read that one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: scripts/qa_gate.py
          sparse-checkout-cone-mode: false
      - run: python3 scripts/qa_gate.py --repo "$GITHUB_REPOSITORY" --pr "$PR"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
