name: Release

# Publishes the package to PyPI when a version tag (v0.2.0) is pushed, with PyPI's trusted
# publishing: no token is stored anywhere, PyPI trusts this workflow in this repo and the `pypi`
# environment (docs/development.md, "Releasing"). Actions are pinned by commit SHA (the version
# is the comment); Dependabot bumps both.
on:
  push:
    tags: ["v*"]

permissions: {}

env:
  PYTHON_VERSION: "3.14"
  # Keep equal to UV_VERSION in ci.yml.
  UV_VERSION: "0.13.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, with main, for the ancestry check below; no token left in
          # .git/config for the steps that follow.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          # A release builds from nothing a previous run left behind.
          enable-cache: false
      # Only reviewed code is released: the tag must point at a commit merged to main.
      - name: The tagged commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $TAG points at $GITHUB_SHA, which isn't on main: tag a commit merged to main"
            exit 1
          fi
      - name: The tag is the version in pyproject.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error file=pyproject.toml::tag $TAG doesn't match version $version: bump [project] version, merge it, then tag v$version"
            exit 1
          fi
      - run: scripts/check.sh
      - run: uv build --out-dir dist
      # The wheel as a user gets it, outside the checkout: the command runs and the default
      # files it ships are there (paths.bundled).
      - name: Smoke-test the wheel
        run: |
          cd "$RUNNER_TEMP"
          uv tool install "$GITHUB_WORKSPACE"/dist/*.whl
          inbox-jev --version
          "$(uv tool dir)"/inbox-jev/bin/python - <<'PY'
          from inbox_jev.paths import bundled

          for name in ("categories.yaml", "accounts.example.yaml", ".env.example"):
              path = bundled(name)
              assert path.is_file() and "inbox_jev/defaults" in str(path), (name, path)
              print("bundled:", path)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/inbox-jev/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
