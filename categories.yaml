# Categories Jev chooses between (exactly one per email). Add an entry to create a new label —
# no code changes needed. The Gmail label is created on the next run.
#
# action:
#   keep                 stay in the inbox
#   archive              remove from inbox
#   archive_unsubscribe  remove from inbox and unsubscribe (only with dmarc=pass + List-Unsubscribe;
#                        otherwise it keeps its category and label and is only archived, never
#                        unsubscribed or spammed)
#   spam                 move to Gmail Spam
# min_confidence: below it, nothing destructive happens; the email stays in the inbox with the
#   review label plus the suggested category label.
categories:
  - key: important
    label: Jev/Important
    criteria: >-
      Written by a real person specifically to me: clients, teammates, partners, investors,
      candidates, decisions, questions or requests addressed to me.
    action: keep
    min_confidence: 0.0

  - key: transactional
    label: Jev/Transactional
    criteria: >-
      Automated record of something I did or bought: receipts, invoices, payment or order
      confirmations, bookings, shipping updates, password resets, verification codes.
    action: archive
    min_confidence: 0.80

  - key: notification
    label: Jev/Notifications
    criteria: >-
      Automated alerts from software tools I use: GitHub, Slack, Google Calendar/Drive/Docs,
      Jira, Linear, Notion, monitoring, CI, security alerts.
    action: archive
    min_confidence: 0.80

  - key: newsletter
    label: Jev/Newsletters
    criteria: >-
      Editorial content I subscribed to: newsletters, digests, blog updates, industry news.
      Mostly informative, not primarily trying to sell something.
    action: archive
    min_confidence: 0.80

  - key: marketing
    label: Jev/Marketing
    criteria: >-
      Promotional email from a legitimate company: ads, sales, discounts, product launches,
      webinars, event promotions, upsells.
    action: archive_unsubscribe
    min_confidence: 0.90

  - key: cold_outreach
    label: Jev/Outreach
    criteria: >-
      Unsolicited sales or partnership pitch from someone I have no relationship with, written
      to look personal: agencies, freelancers, lead-gen, recruiting or dev-shop offers, "quick
      question" and follow-up sequences, event or sponsorship pitches, SEO/link-building offers.
    action: archive
    min_confidence: 0.80

  - key: spam
    label: Jev/Spam
    criteria: >-
      Fraudulent or malicious email: scams, phishing, fake invoices or account alerts, malware,
      impersonation, or bulk mail with forged or failing sender authentication.
    action: spam
    min_confidence: 0.90

# Extra yes/no questions. Additive: a label is applied when probability >= threshold,
# on top of the category. Remove the list or leave it empty to skip.
tags:
  - key: invoice_to_pay
    label: Jev/Invoices
    question: Does this email contain an invoice or bill that I need to pay?
    threshold: 0.8

# Only applied to emails that stay in the inbox (action keep, or low confidence).
needs_reply:
  label: Jev/Needs Reply
  question: Does the sender expect a reply or an action from me personally?
  threshold: 0.7

review_label: Jev/Review
processed_label: Jev/Processed

# A sender becomes an automatic rule (skips Jev) after this many consistent
# classifications at or above this confidence.
auto_rule:
  hits: 3
  min_confidence: 0.95
