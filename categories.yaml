# Categories Jev chooses between (exactly one per email). Add an entry to create a new label —
# no code changes needed. The Gmail label is created on the next run.
#
# action:
#   keep                 stay in the inbox
#   archive              remove from inbox
#   archive_unsubscribe  remove from inbox and unsubscribe (only with dmarc=pass + List-Unsubscribe
#                        and never through a group or discussion list; otherwise it keeps its
#                        category and label and is only archived, never unsubscribed or spammed.
#                        See docs/how-it-decides.md, section 3.3)
#   spam                 move to Gmail Spam
# min_confidence (0 to 1, like every threshold and probability in this file): below it, nothing
#   destructive happens; the email stays in the inbox with the review label plus the suggested
#   category label (unless archive_group_min_confidence below applies).
# unsubscribe_known_contacts (archive_unsubscribe only, default true): false archives but never
#   unsubscribes when you have written to the sender or their domain.
categories:
  - key: important
    label: Jev/Important
    criteria: >-
      Written by a real person specifically to me: clients, teammates, partners, investors,
      candidates, decisions, questions or requests addressed to me. Not mass mail that only
      greets me by name, and not a conversation between other people that an unrelated sender
      pasted into a message to me (see spam).
    action: keep
    min_confidence: 0.0

  - key: action_required
    label: Jev/Action
    criteria: >-
      Automated email from a service I use that needs me to do something: approve a payment,
      a request or a message held for moderation that is pending my approval, update a payment
      method or expiring card, verify my account or domain, act on a security alert, review
      or sign a document, tax return or agreement sent through a document, e-signature or
      client-portal service, or fix or renew something before a deadline. Also a new
      submission from a form on my or my company's own website or landing page (a lead, a
      contact, quote or demo request) relayed by a form or CRM tool such as HubSpot, Typeform,
      Webflow, Jotform or Google Forms: someone is waiting for my reply. Also a meeting that
      someone booked, rescheduled or cancelled with me through a scheduling link or booking
      page (HubSpot Meetings "You've been booked by", Calendly, Cal.com, Chili Piper, Google
      Calendar appointment schedules): someone expects me at that time. Also a calendar
      invitation, update or cancellation that a person sent me from their own calendar (Google
      Calendar, Outlook): it waits on my RSVP or changes my day; so is a response to an
      invitation I sent that proposes a new time or carries a note asking me something. Not
      receipts, reminders of things already done or of meetings already in my calendar, daily
      agendas, a plain response to an invitation I sent (Accepted, Declined, Tentative, "has
      accepted this invitation"), FYI alerts, held-spam reports, surveys, feedback or review
      requests, or promotional calls to action.
    action: keep
    min_confidence: 0.0

  - key: transactional
    label: Jev/Transactional
    criteria: >-
      Automated record of something I did or bought, with nothing left for me to do: receipts,
      paid invoices, payment or order confirmations, confirmations of bookings and reservations
      made by me or for me (travel, hotels, restaurants, an appointment with a provider),
      shipping updates, password resets, verification codes, copies of documents I already
      signed or filed. Not a meeting someone booked with me through my scheduling link, which is
      action_required.
    action: archive
    min_confidence: 0.80

  - key: notification
    label: Jev/Notifications
    criteria: >-
      Automated FYI alerts and digests from software tools I use: GitHub, Slack, Google
      Calendar/Drive/Docs, Jira, Linear, Notion, analytics, monitoring, CI, policy or product
      updates, and automated held-spam reports from mailing lists and groups (e.g. Google
      Groups "Moderator's spam report"). Nothing for me to do. This includes form and CRM
      tools' dashboards, reports, deal or pipeline updates and account notices, but not a new
      submission from a form on my own website or landing page (a lead or contact request),
      which is action_required. It also includes calendar and scheduling tools' daily agendas,
      reminders of meetings already in my calendar ("starts in 10 minutes") and account
      notices, but not a meeting someone booked, rescheduled or cancelled with me through a
      scheduling link, nor an invitation, update or cancellation a person sent me from their own
      calendar, which are action_required. It includes a plain response to an invitation I sent
      ("Accepted: …", "Declined: …", "Tentative: …", "<name> has accepted this invitation", from
      Google Calendar or Outlook): nothing left for me to do, but not one that proposes a new
      time or carries a note asking me something, which is action_required.
    action: archive
    min_confidence: 0.80

  - key: newsletter
    label: Jev/Newsletters
    criteria: >-
      Editorial content I subscribed to: newsletters, digests, blog updates, industry news.
      Mostly informative, not primarily trying to sell something.
    action: archive
    min_confidence: 0.80

  - key: marketing
    label: Jev/Marketing
    criteria: >-
      Promotional email from a legitimate company: ads, sales, discounts, product launches,
      webinars, event promotions, upsells.
    action: archive_unsubscribe
    min_confidence: 0.90

  - key: cold_outreach
    label: Jev/Outreach
    criteria: >-
      Unsolicited sales or partnership pitch from someone I have no relationship with, written
      to look personal: agencies, freelancers, lead-gen, recruiting or dev-shop offers, "quick
      question" and follow-up sequences, meeting or podcast invitations, event or sponsorship
      pitches, SEO/link-building offers. Usually from someone I have never written to.
    # Sequence tools (Instantly, Smartlead, ...) send RFC 8058 List-Unsubscribe headers and stop
    # the sequence on unsubscribe. Same safeguards as marketing; 0.90 like any unsubscribe.
    # A "pitch" from someone I already wrote to (or their company) is where Jev is most likely
    # wrong, and an opt-out there can cover all of that company's mail: archive only.
    action: archive_unsubscribe
    min_confidence: 0.90
    unsubscribe_known_contacts: false

  - key: spam
    label: Jev/Spam
    criteria: >-
      Fraudulent or malicious email: scams, phishing, fake invoices or account alerts,
      voicemail, document or e-signature notices that impersonate a service, malware, or bulk
      mail with forged or failing sender authentication. Passing SPF or DKIM (sender_auth)
      only proves which domain sent it, not that it is legitimate: phishing often passes them
      for the attacker's own domain. Signs of phishing are mismatches: links (link_domains) to
      a brand unrelated to the sender (a notice that claims to be from one brand while its
      action link goes to another), a reply subject (RE:) with no earlier message
      (reply_without_thread), a copied conversation between other people that I am not part
      of; dmarc none or fail makes them stronger. Not
      spam: a notice from an established document, e-signature, tax-return or client-portal
      service whose sender passes DMARC and whose links go to that service's own brand
      domains (they can differ from the sending domain); that is action_required or
      transactional.
    action: spam
    min_confidence: 0.90

# Archive when the archive categories (archive and archive_unsubscribe actions) add up to this
# probability, even if Jev's top category alone is below its min_confidence: it is sure the email
# goes away, just not which label fits best. Never unsubscribes or spams. Remove to disable.
archive_group_min_confidence: 0.90
# An email Jev thinks expects a reply skips the rule above when I have written to the sender or
# a person at their domain (unless it comes from a no-reply address with no other Reply-To);
# otherwise only when important + action_required together reach this: every pitch
# "expects a reply". 0 = always skip. At most 1 - archive_group_min_confidence (0.10 here):
# above that it could never be reached and the check is rejected at load.
archive_group_reply_keep_probability: 0.05

# Extra yes/no questions. Additive: a label is applied when probability >= threshold,
# on top of the category (also on allowlisted emails and rules to keep categories, which ask Jev
# for these flags only). Remove the list or leave it empty to skip.
tags:
  - key: invoice_to_pay
    label: Jev/Invoices
    question: Does this email contain an invoice or bill that I need to pay?
    threshold: 0.8

# Only applied to emails that stay in the inbox (action keep, or low confidence), including
# allowlisted emails and rules to keep categories (Jev is asked for the flags only).
needs_reply:
  label: Jev/Needs Reply
  question: >-
    Does the sender expect a reply or an action from me personally? Yes: a person writing to
    me, or something only I can do (pay, sign, approve, authorize, confirm an appointment, renew
    an expiring document, secure my account), or a lead or contact request submitted through a
    form on my own website. No: company or bulk mail (surveys, feedback,
    ratings or reviews, promotions, webinars or events), even if it asks me to reply or click,
    a scheduling tool's notice that someone booked, moved or cancelled a meeting with me
    (already confirmed: I only attend), a calendar invitation, update or cancellation, or a
    response proposing a new time (I answer it in my calendar, not by email) unless it also
    asks me a personal question,
    a conversation between other people that isn't addressed to me, and phishing.
  threshold: 0.7

review_label: Jev/Review
processed_label: Jev/Processed

# A sender becomes an automatic rule (skips Jev, or for keep categories asks it for the flags
# only) after this many consistent classifications of different emails at or above this
# confidence, in label or act mode (never in dry_run). An email classified again adds no hit,
# but an answer in another category restarts a pending rule. An answer doesn't count when the
# keep categories (other than the decided one) add up to max_keep_probability or more, and a
# keep answer restarts a pending archive rule: senders that mix routine and action-needed mail
# keep going through Jev.
auto_rule:
  hits: 3
  min_confidence: 0.95
  max_keep_probability: 0.02
