# Copy to accounts.yaml (gitignored). One entry per Gmail account.
# Each account needs a token: `inbox-jev auth add you@example.com`
accounts:
  - email: you@example.com
    # Slack member ID to DM the daily digest to (Profile → ⋯ → Copy member ID). Optional.
    slack_user_id: U0123456789
    # Language of the digest: en or es. Optional (default: en).
    digest_language: en
    # Overrides the global MODE for this account. Optional.
    mode: label
    # Never touched: always "important", never archived or unsubscribed. Mail relayed by a
    # Google Group on a trusted domain (see group_domains) is judged by its author, so
    # allow_domains doesn't cover strangers who write to hello@example.com: a group only counts
    # through its exact address in allow_senders (e.g. finance@example.com to keep it untouched).
    allow_domains:
      - example.com
      - mybank.com
    allow_senders:
      - boss@partner.com
    # Google Groups trust (opt-in): for groups on these domains, the author in X-Original-Sender
    # is used as the sender. Empty or absent = no group is trusted, not even the account's own
    # domain; every group stays keyed on its address. List only domains whose Google Workspace
    # you control (subdomains are included). Public providers (country domains too, e.g.
    # yahoo.com.ar), googlegroups.com and public suffixes from the Public Suffix List (co.uk,
    # gouv.fr, com.ai, wa.gov.au, github.io) are rejected, and the file then fails to load.
    # Optional (default: none).
    group_domains:
      - example.com
    # In act mode, only these categories are archived/spammed/unsubscribed; the others just get
    # their labels. Useful to roll out act gradually. Optional (default: all categories).
    act_categories: [transactional, notification, newsletter]
    # Per-account confidence overrides by category key. Optional.
    min_confidence:
      marketing: 0.95
