x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    # The image CI built and pushed for the deployed commit: scripts/deploy.sh pulls
    # ghcr.io/<repo>:sha-<short> and records IMAGE_TAG in .env, so the timers run that image.
    # `docker compose build` still works without registry access and tags its build the same way.
    image: ${IMAGE:-ghcr.io/hellolitebox/litebox-inbox-jev}:${IMAGE_TAG:-latest}
    # A missing image is pulled, not rebuilt from the checkout (which would run GIT_SHA=unknown).
    pull_policy: missing
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    # Pick a uid/gid no host user owns: whoever has that uid on the host can read data/ and
    # secrets/ (Gmail tokens). Set APP_UID/APP_GID in .env.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/inbox-jev.db}
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets          # rw: OAuth tokens get refreshed
      - ./accounts.yaml:/app/accounts.yaml:ro
      - ./categories.yaml:/app/categories.yaml:ro
    logging: *logging

  # Optional read-only DB browser: `docker compose --profile viewer up -d viewer`
  # then `ssh -L 8001:localhost:8001 <host>` → http://localhost:8001
  viewer:
    profiles: ["viewer"]
    image: datasetteproject/datasette:0.65.1
    command: datasette serve -i /data/inbox-jev.db -h 0.0.0.0 -p 8001
    volumes:
      - ./data:/data:ro
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped
    logging: *logging
