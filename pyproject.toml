[project]
name = "inbox-jev"
version = "0.1.0"
description = "Triage your Gmail inbox with TypeSafe Jev: label, archive, and auto-unsubscribe from marketing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Litebox" }]
keywords = ["gmail", "email", "inbox", "triage", "unsubscribe", "typesafe", "jev"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Email",
]
dependencies = [
    "typesafe-sdk>=0.7.4",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=7",
    "ruff==0.17.0",
    "mypy>=2.4",
    "pre-commit>=3",
    # Markdown formatter (.mdformat.toml); pinned here and in .pre-commit-config.yaml.
    "mdformat==1.0.0",
    "mdformat-gfm==1.0.0",
    "mdformat-frontmatter==2.1.2",
]

[project.scripts]
inbox-jev = "inbox_jev.cli:app"

[project.urls]
Homepage = "https://github.com/hellolitebox/litebox-inbox-jev"
Documentation = "https://github.com/hellolitebox/litebox-inbox-jev#readme"
Issues = "https://github.com/hellolitebox/litebox-inbox-jev/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inbox_jev"]

# The repo's default files, shipped in the wheel for an install run outside a checkout
# (`paths.bundled`; ADR 0053). A checkout reads them from the repo root instead.
[tool.hatch.build.targets.wheel.force-include]
"categories.yaml" = "inbox_jev/defaults/categories.yaml"
"accounts.example.yaml" = "inbox_jev/defaults/accounts.example.yaml"
".env.example" = "inbox_jev/defaults/.env.example"

[tool.hatch.build.targets.sdist]
include = [
    "src/inbox_jev",
    "categories.yaml",
    "accounts.example.yaml",
    ".env.example",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
# An unclosed resource fails the test run. SQLite reports a connection that is never closed
# (an engine not disposed) as `ResourceWarning: unclosed database` from its finalizer (Python
# 3.13+), which pytest turns into PytestUnraisableExceptionWarning.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "SIM", "C901",
    "C4", "PIE", "PERF", "RUF", "PTH",
    "FBT",   # boolean positional parameters: make them keyword-only (`*,`)
    "N818",  # exception classes end in `Error`
    "ARG",   # unused arguments
]

[tool.ruff.lint.per-file-ignores]
# Typer reads a command's options from its parameters, so a boolean flag is a positional
# parameter with a default there by design.
"src/inbox_jev/cli.py" = ["FBT001", "FBT002"]
# Fakes, stubs and monkeypatched lambdas take the arguments of what they stand in for, used or not.
"tests/**" = ["ARG"]

[tool.ruff.lint.mccabe]
# Keeps the pass loop, the digest and the unsubscribe-retry checklist from regrowing.
max-complexity = 12

[tool.mypy]
# tests/fakes.py: so the fakes are checked against the protocols they stand in for.
files = ["src", "scripts", "tests/fakes.py"]
python_version = "3.11"
# Every def annotated, every generic parameterised, no Any returned where a type is declared
# (tests/fakes.py included: typed, not exempted).
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true

# The only untyped imports: PyYAML ships no stubs and the two Google client modules carry no
# types, so their objects are Any. Everything else (typesafe_sdk, google.auth, sqlalchemy, httpx,
# pydantic) is typed; a new import without types fails here instead of silently becoming Any.
[[tool.mypy.overrides]]
module = ["yaml", "googleapiclient.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true

# CI runs `pytest --cov` (the test job); a plain `pytest` measures nothing, so running a few
# tests locally never trips fail_under.
[tool.coverage.run]
source = ["src/inbox_jev", "scripts"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 97  # total was 97.95% when set; raise it as coverage grows, never lower it
