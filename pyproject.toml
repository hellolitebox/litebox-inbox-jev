[project]
name = "inbox-jev"
version = "0.1.0"
description = "Triage your Gmail inbox with TypeSafe Jev: label, archive, and auto-unsubscribe from marketing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typesafe-sdk>=0.7.4",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.17.0", "mypy>=2.4", "pre-commit>=3"]

[project.scripts]
inbox-jev = "inbox_jev.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inbox_jev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
files = ["src", "scripts"]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true

# The only untyped imports: PyYAML ships no stubs and the two Google client modules carry no
# types, so their objects are Any. Everything else (typesafe_sdk, google.auth, sqlalchemy, httpx,
# pydantic) is typed; a new import without types fails here instead of silently becoming Any.
[[tool.mypy.overrides]]
module = ["yaml", "googleapiclient.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true
